pedidos.rabbitmq.exchange.dlq=pedidos.dlq.exchange

pedidos.rabbitmq.queue.cocina=pedidos.cocina
pedidos.rabbitmq.queue.tickets=pedidos.tickets
pedidos.rabbitmq.queue.dlq=pedidos.dlq

pedidos.rabbitmq.routingkey.cocina=pedidos.cocina.routingkey
pedidos.rabbitmq.routingkey.tickets=pedidos.tickets.routingkey
pedidos.rabbitmq.routingkey.dlq=pedidos.dlq.routingkey